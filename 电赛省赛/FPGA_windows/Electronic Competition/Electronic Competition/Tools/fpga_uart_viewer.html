html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;fpga-uart-rx-view&quot;&gt;
  &lt;div class=&quot;viz-controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;fpga-rx-file&quot;&gt;STM32接收快照
      &lt;input class=&quot;form-control&quot; id=&quot;fpga-rx-file&quot; type=&quot;file&quot; accept=&quot;.bin,application/octet-stream&quot;&gt;
    &lt;/label&gt;
    &lt;button class=&quot;btn&quot; id=&quot;fpga-rx-wave-csv&quot; type=&quot;button&quot; disabled&gt;导出时域CSV&lt;/button&gt;

      &lt;span class=&quot;text-muted&quot;&gt;时域&lt;/span&gt;
      &lt;span class=&quot;viz-stat-value&quot; id=&quot;fpga-rx-time-stat&quot;&gt;&lt;/span&gt;
      &lt;span class=&quot;text-small&quot; id=&quot;fpga-rx-time-detail&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;

      &lt;span class=&quot;text-muted&quot;&gt;频谱峰值&lt;/span&gt;

  &lt;/div&gt;

    &lt;div class=&quot;tooltip&quot; id=&quot;fpga-rx-spectrum-tip&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p class=&quot;text-small&quot; id=&quot;fpga-rx-diagnostics&quot;&gt;&lt;/p&gt;

&lt;style&gt;

&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  &#x27;use strict&#x27;;

  const root = document.getElementById(&#x27;fpga-uart-rx-view&#x27;);
  const STRUCT_BYTES = 24124;
  const MAX_WAVE = 2048;
  const MAX_SPECTRUM = 10000;
  const OFF = {
    status: 0,
    waveCount: 2,
    dtNs: 4,
    wave: 8,
    vpp: 4104,
    vrms: 4106,
    spectrumCount: 4108,
    spectrumStart: 4112,
    spectrumSpacing: 4116,
    spectrum: 4120,
    sequence: 24120,
    valid: 24121
  };

  const fileInput = root.querySelector(&#x27;#fpga-rx-file&#x27;);
  const statusText = root.querySelector(&#x27;#fpga-rx-status&#x27;);
  const summary = root.querySelector(&#x27;#fpga-rx-summary&#x27;);
  const diagnostics = root.querySelector(&#x27;#fpga-rx-diagnostics&#x27;);
  const waveCsv = root.querySelector(&#x27;#fpga-rx-wave-csv&#x27;);
  const spectrumCsv = root.querySelector(&#x27;#fpga-rx-spectrum-csv&#x27;);
  const waveCanvas = root.querySelector(&#x27;#fpga-rx-wave&#x27;);
  const spectrumCanvas = root.querySelector(&#x27;#fpga-rx-spectrum&#x27;);
  let snapshot = null;

  function parseSnapshot(buffer) {
    if (buffer.byteLength !== STRUCT_BYTES) {
      throw new Error(`文件长度为 ${buffer.byteLength} 字节，应为 ${STRUCT_BYTES} 字节`);
    }
    const view = new DataView(buffer);
    const waveCount = view.getUint16(OFF.waveCount, true);
    const spectrumCount = view.getUint16(OFF.spectrumCount, true);
    if (waveCount &lt; 2 || waveCount &gt; MAX_WAVE) {
      throw new Error(`波形点数 N=${waveCount} 超出 2…${MAX_WAVE}`);
    }
    if (spectrumCount &lt; 3 || spectrumCount &gt; MAX_SPECTRUM) {
      throw new Error(`频谱点数 K=${spectrumCount} 超出 3…${MAX_SPECTRUM}`);
    }

    const dtNs = view.getUint32(OFF.dtNs, true);
    const startHz = view.getUint32(OFF.spectrumStart, true);
    const spacingHz = view.getUint32(OFF.spectrumSpacing, true);
    const wave = new Array(waveCount);
    const spectrum = new Array(spectrumCount);

    for (let i = 0; i &lt; waveCount; i++) {
      wave[i] = {
        index: i,
        x: i * dtNs / 1000000,
        y: view.getInt16(OFF.wave + i * 2, true) * 0.01
      };
    }
    for (let i = 0; i &lt; spectrumCount; i++) {
      spectrum[i] = {
        index: i,
        x: (startHz + i * spacingHz) / 1000,
        y: view.getUint16(OFF.spectrum + i * 2, true) * 0.01
      };
    }

    const minV = Math.min(...wave.map(p =&gt; p.y));
    const maxV = Math.max(...wave.map(p =&gt; p.y));
    const rms = Math.sqrt(wave.reduce((sum, p) =&gt; sum + p.y * p.y, 0) / wave.length);
    let peak = spectrum[0];
    for (const point of spectrum) if (point.y &gt; peak.y) peak = point;

    return {
      status: view.getUint8(OFF.status),
      sequence: view.getUint8(OFF.sequence),
      valid: view.getUint8(OFF.valid),
      waveCount,
      dtNs,
      vppMv: view.getUint16(OFF.vpp, true) * 0.01,
      vrmsMv: view.getUint16(OFF.vrms, true) * 0.01,
      spectrumCount,
      startHz,
      spacingHz,
      wave,
      spectrum,
      calculatedVpp: maxV - minV,
      calculatedRms: rms,
      minV,
      maxV,
      peak
    };
  }

  function theme(name, fallback) {
    return getComputedStyle(root).getPropertyValue(name).trim() || fallback;
  }

  function compact(value) {
    if (!Number.isFinite(value)) return &#x27;—&#x27;;
    const abs = Math.abs(value);
    if (abs &gt;= 1000) return value.toFixed(0);
    if (abs &gt;= 100) return value.toFixed(1);
    if (abs &gt;= 10) return value.toFixed(2);
    return value.toFixed(3);
  }

  function drawChart(canvas, points, xLabel, yLabel, tooltip, xDigits) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const width = Math.max(320, rect.width);
    const height = rect.height;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    const ctx = canvas.getContext(&#x27;2d&#x27;);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);
    if (!points.length) return;

    const pad = { left: 58, right: 16, top: 14, bottom: 38 };
    const plotW = width - pad.left - pad.right;
    const plotH = height - pad.top - pad.bottom;
    const xMin = points[0].x;
    const xMaxRaw = points[points.length - 1].x;
    const xMax = xMaxRaw === xMin ? xMin + 1 : xMaxRaw;
    let yMin = Math.min(...points.map(p =&gt; p.y));
    let yMax = Math.max(...points.map(p =&gt; p.y));
    if (yMax === yMin) {
      yMin -= 1;
      yMax += 1;
    } else {
      const margin = (yMax - yMin) * 0.08;
      yMin -= margin;
      yMax += margin;
    }

    const xToPx = x =&gt; pad.left + (x - xMin) / (xMax - xMin) * plotW;
    const yToPx = y =&gt; pad.top + (yMax - y) / (yMax - yMin) * plotH;
    const foreground = theme(&#x27;--foreground&#x27;, &#x27;#202020&#x27;);
    const muted = theme(&#x27;--muted-foreground&#x27;, &#x27;#707070&#x27;);
    const grid = theme(&#x27;--border&#x27;, &#x27;#b0b0b0&#x27;);
    const series = theme(&#x27;--viz-series-1&#x27;, &#x27;#2878c8&#x27;);

    ctx.lineWidth = 1;
    ctx.strokeStyle = grid;
    ctx.fillStyle = muted;
    ctx.font = &#x27;12px system-ui, sans-serif&#x27;;
    ctx.textAlign = &#x27;right&#x27;;
    ctx.textBaseline = &#x27;middle&#x27;;
    for (let i = 0; i &lt;= 4; i++) {
      const y = pad.top + plotH * i / 4;
      const value = yMax - (yMax - yMin) * i / 4;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(width - pad.right, y);
      ctx.stroke();
      ctx.fillText(compact(value), pad.left - 7, y);
    }
    ctx.textAlign = &#x27;center&#x27;;
    ctx.textBaseline = &#x27;top&#x27;;
    for (let i = 0; i &lt;= 5; i++) {
      const x = pad.left + plotW * i / 5;
      const value = xMin + (xMax - xMin) * i / 5;
      ctx.beginPath();
      ctx.moveTo(x, pad.top);
      ctx.lineTo(x, pad.top + plotH);
      ctx.stroke();
      ctx.fillText(value.toFixed(xDigits), x, pad.top + plotH + 7);
    }

    ctx.fillStyle = foreground;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(xLabel, pad.left + plotW / 2, height - 15);
    ctx.save();
    ctx.translate(13, pad.top + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(yLabel, 0, 0);
    ctx.restore();

    ctx.strokeStyle = series;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    points.forEach((point, index) =&gt; {
      const x = xToPx(point.x);
      const y = yToPx(point.y);
      if (index === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    canvas.onpointermove = event =&gt; {
      const bounds = canvas.getBoundingClientRect();
      const localX = event.clientX - bounds.left;
      if (localX &lt; pad.left || localX &gt; width - pad.right) {
        tooltip.style.display = &#x27;none&#x27;;
        return;
      }
      const ratio = (localX - pad.left) / plotW;
      const index = Math.max(0, Math.min(points.length - 1,
        Math.round(ratio * (points.length - 1))));
      const point = points[index];
      tooltip.textContent = `#${point.index}　${point.x.toFixed(xDigits + 2)} ${xLabel.split(&#x27;/&#x27;)[1]}　${point.y.toFixed(3)} ${yLabel.split(&#x27;/&#x27;)[1]}`;
      tooltip.style.left = `${xToPx(point.x)}px`;
      tooltip.style.top = `${yToPx(point.y)}px`;
      tooltip.style.display = &#x27;block&#x27;;
    };
    canvas.onpointerleave = () =&gt; { tooltip.style.display = &#x27;none&#x27;; };
  }

  function render() {
    if (!snapshot) {
      drawChart(waveCanvas, [], &#x27;&#x27;, &#x27;&#x27;, root.querySelector(&#x27;#fpga-rx-wave-tip&#x27;), 3);
      drawChart(spectrumCanvas, [], &#x27;&#x27;, &#x27;&#x27;, root.querySelector(&#x27;#fpga-rx-spectrum-tip&#x27;), 1);
      return;
    }
    drawChart(waveCanvas, snapshot.wave, &#x27;时间/ms&#x27;, &#x27;电压/mV&#x27;,
      root.querySelector(&#x27;#fpga-rx-wave-tip&#x27;), 4);
    drawChart(spectrumCanvas, snapshot.spectrum, &#x27;频率/kHz&#x27;, &#x27;幅值/mV&#x27;,
      root.querySelector(&#x27;#fpga-rx-spectrum-tip&#x27;), 1);
  }

  function updateSummary() {
    root.querySelector(&#x27;#fpga-rx-frame&#x27;).textContent = `SEQ ${snapshot.sequence}`;
    root.querySelector(&#x27;#fpga-rx-frame-detail&#x27;).textContent =
      `status=${snapshot.status}，valid=${snapshot.valid}`;
    root.querySelector(&#x27;#fpga-rx-time-stat&#x27;).textContent =
      `${snapshot.waveCount} 点`;
    root.querySelector(&#x27;#fpga-rx-time-detail&#x27;).textContent =
      `dt=${snapshot.dtNs} ns，跨度=${snapshot.wave.at(-1).x.toFixed(6)} ms`;
    root.querySelector(&#x27;#fpga-rx-peak&#x27;).textContent =
      `${snapshot.peak.x.toFixed(3)} kHz`;
    root.querySelector(&#x27;#fpga-rx-peak-detail&#x27;).textContent =
      `${snapshot.peak.y.toFixed(3)} mV，K=${snapshot.spectrumCount}`;
    summary.hidden = false;

    const notes = [];
    if (snapshot.status !== 0) notes.push(`状态码为 ${snapshot.status}`);
    if (snapshot.valid !== 1) notes.push(`valid=${snapshot.valid}`);
    if (snapshot.dtNs !== 250) notes.push(`采样间隔为 ${snapshot.dtNs} ns，不是4 MHz对应的250 ns`);
    const vppError = Math.abs(snapshot.calculatedVpp - snapshot.vppMv);
    if (vppError &gt; Math.max(1, snapshot.vppMv * 0.1)) {
      notes.push(`数组计算Vpp=${snapshot.calculatedVpp.toFixed(2)} mV，与字段Vpp=${snapshot.vppMv.toFixed(2)} mV差异明显`);
    }
    const rmsError = Math.abs(snapshot.calculatedRms - snapshot.vrmsMv);
    if (rmsError &gt; Math.max(1, snapshot.vrmsMv * 0.15)) {
      notes.push(`数组计算RMS=${snapshot.calculatedRms.toFixed(2)} mV，与字段Vrms=${snapshot.vrmsMv.toFixed(2)} mV差异明显`);
    }
    if (snapshot.peak.y === 0) notes.push(&#x27;整个频谱幅值均为0&#x27;);
    diagnostics.textContent = notes.length
      ? `需要关注：${notes.join(&#x27;；&#x27;)}。`
      : `一致性检查通过：数组Vpp=${snapshot.calculatedVpp.toFixed(2)} mV，数组RMS=${snapshot.calculatedRms.toFixed(2)} mV，频点间隔=${snapshot.spacingHz} Hz。`;
    diagnostics.dataset.level = notes.length ? &#x27;error&#x27; : &#x27;ok&#x27;;
  }

  function saveCsv(kind) {
    if (!snapshot) return;
    const rows = kind === &#x27;wave&#x27;
      ? [[&#x27;index&#x27;, &#x27;time_ms&#x27;, &#x27;voltage_mv&#x27;],
         ...snapshot.wave.map(p =&gt; [p.index, p.x, p.y])]
      : [[&#x27;index&#x27;, &#x27;frequency_khz&#x27;, &#x27;amplitude_mv&#x27;],
         ...snapshot.spectrum.map(p =&gt; [p.index, p.x, p.y])];
    const blob = new Blob([rows.map(row =&gt; row.join(&#x27;,&#x27;)).join(&#x27;\r\n&#x27;)],
      { type: &#x27;text/csv;charset=utf-8&#x27; });
    const link = document.createElement(&#x27;a&#x27;);
    link.href = URL.createObjectURL(blob);
    link.download = kind === &#x27;wave&#x27; ? &#x27;stm32_waveform.csv&#x27; : &#x27;stm32_spectrum.csv&#x27;;
    link.click();
    URL.revokeObjectURL(link.href);
  }

  fileInput.addEventListener(&#x27;change&#x27;, async () =&gt; {
    const file = fileInput.files &amp;&amp; fileInput.files[0];
    if (!file) return;
    try {
      snapshot = parseSnapshot(await file.arrayBuffer());
      statusText.textContent = `已加载 ${file.name}（${file.size} 字节）。`;
      waveCsv.disabled = false;
      spectrumCsv.disabled = false;
      updateSummary();
      render();
    } catch (error) {
      snapshot = null;
      summary.hidden = true;
      waveCsv.disabled = true;
      spectrumCsv.disabled = true;
      diagnostics.textContent = &#x27;&#x27;;
      statusText.textContent = `无法解析：${error.message}`;
      render();
    }
  });

  waveCsv.addEventListener(&#x27;click&#x27;, () =&gt; saveCsv(&#x27;wave&#x27;));
  spectrumCsv.addEventListener(&#x27;click&#x27;, () =&gt; saveCsv(&#x27;spectrum&#x27;));
  window.addEventListener(&#x27;resize&#x27;, render);
  render();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
